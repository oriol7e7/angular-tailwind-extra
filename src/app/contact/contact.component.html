<section
  id="hero"
  class="w-full py-8 px-4 flex flex-col gap-2 justify-center items-start lg:gap-10"
>
  <h2 id="info" class="text-3xl">Contacta amb nosaltres</h2>
  <form class="w-70 flex flex-col gap-4 self-center">
    <label for="name">Nom:*</label>
    <input
      class="font-normal border-2 border-white rounded-sm px-1.5 py-2 outline-0 invalid:border-red-500 valid:border-green-300 focus:border-yellow-300"
      type="text"
      placeholder="John Doe"
      required
    />
    <label for="email">Email:*</label>
    <input
      class="font-normal border-2 border-white rounded-sm px-1.5 py-2 outline-0 invalid:border-red-500 valid:border-green-300 focus:border-yellow-300"
      type="email"
      placeholder="johndoe@gmail.com"
      required
    />
    <label for="info">Asumpte:*</label>
    <input
      class="font-normal border-2 border-white rounded-sm px-1.5 py-2 outline-0 invalid:border-red-500 valid:border-green-300 focus:border-yellow-300"
      type="text"
      placeholder="Consulta interessant"
      required
    />
    <label for="msg">Missage:*</label>
    <input
      class="font-normal border-2 border-white rounded-sm px-1.5 py-2 outline-0 invalid:border-red-500 valid:border-green-300 focus:border-yellow-300"
      type="text"
      placeholder="Perque la web es tan xula?"
      required
    />
    <button class="px-4 py-2 text-black bg-yellow-300 rounded-md cursor-pointer hover:opacity-90">
      Envia
    </button>
  </form>
</section>
