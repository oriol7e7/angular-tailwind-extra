<article
  class="flex flex-col rounded-sm shadow-md transition-all hover:-translate-y-2 bg-gray-200 text-gray-900 dark:bg-gray-800 dark:text-gray-100"
>
  <img class="w-full rounded-t-sm" [src]="mode().img" alt="" />
  <div class="flex flex-col p-2">
    <h5 class="text-lg text-gray-900 dark:text-gray-100">{{ mode().title }}</h5>
    <p class="text-sm font-normal lg:text-md text-gray-900 dark:text-gray-100">
      {{ mode().description }}
    </p>
  </div>
</article>
