<article class="flex flex-col rounded-sm shadow-md transition-all hover:-translate-y-2 bg-gray-700">
  <img class="w-full rounded-t-sm" [src]="mode().img" alt="" />
  <div class="flex flex-col p-2">
    <h5 class="text-lg">{{ mode().title }}</h5>
    <p class="text-sm font-normal lg:text-md">{{ mode().description }}</p>
  </div>
</article>
